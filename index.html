/* Smart Sheet AI — gaya aplikasi. Kertas buku besar (hijau-abu), tinta biru tua, aksen teal. */
:root {
  --paper: #F3F6F2;
  --surface: #FFFFFF;
  --surface-2: #EBF0EA;
  --ink: #18252F;
  --ink-2: #4A5A63;
  --ink-3: #6E7C83;
  --rule: #D3DDD5;
  --rule-strong: #A9BBAF;
  --accent: #1D6A56;
  --accent-hover: #175646;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE6;
  --stamp: #B9731B;
  --danger: #B3402B;
  --danger-soft: #F8DDD6;
  --warn-soft: #FFF1CF;
  --warn-ink: #6B4700;
  --grid-line: #DCE4DD;
  --grid-head: #E7EEE8;
  --sel-fill: rgba(29, 106, 86, .11);
  --shadow: 0 6px 24px rgba(24, 37, 47, .16);
  --radius: 6px;
  --font-ui: "Segoe UI", "Helvetica Neue", Roboto, system-ui, -apple-system, "Noto Sans", sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, "Noto Serif", serif;
  --nav-w: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #11181A;
  --surface: #172123;
  --surface-2: #1E2B2D;
  --ink: #E7EDE9;
  --ink-2: #A9B8B1;
  --ink-3: #82928B;
  --rule: #2B3A3B;
  --rule-strong: #46605A;
  --accent: #5CC4A3;
  --accent-hover: #7AD3B6;
  --accent-ink: #08201A;
  --accent-soft: #1C3A33;
  --stamp: #E0A04A;
  --danger: #EE8B76;
  --danger-soft: #4A2A24;
  --warn-soft: #43361A;
  --warn-ink: #F0D08A;
  --grid-line: #263536;
  --grid-head: #1D2A2C;
  --sel-fill: rgba(92, 196, 163, .15);
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-ui); font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--paper);
  -webkit-text-size-adjust: 100%; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---------- Bingkai aplikasi ---------- */
#app { display: grid; grid-template-columns: var(--nav-w) 1fr; grid-template-rows: 100%; height: 100%; }
#nav { background: var(--surface-2); border-right: 1px solid var(--rule); display: flex; flex-direction: column; align-items: stretch; padding: 8px 0; gap: 2px; overflow-y: auto; }
#nav .brand { display: grid; place-items: center; height: 48px; margin-bottom: 6px; }
#nav .brand img { width: 34px; height: 34px; border-radius: 8px; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border: 0; background: none; color: var(--ink-2); font-size: 11px; border-left: 3px solid transparent; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:hover { background: var(--accent-soft); color: var(--ink); }
.nav-btn[aria-current="page"] { color: var(--accent); border-left-color: var(--accent); background: var(--surface); font-weight: 600; }
.nav-spacer { flex: 1; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

#topbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--rule); min-height: 46px; }
#topbar .wbname { font-family: var(--font-display); font-size: 17px; font-weight: 600; border: 1px solid transparent; background: none; padding: 3px 8px; border-radius: var(--radius); min-width: 120px; max-width: 360px; width: 26ch; text-overflow: ellipsis; }
#topbar .wbname:hover { border-color: var(--rule); }
#topbar .wbname:focus { border-color: var(--accent); background: var(--paper); }
.savestate { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.savestate::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.savestate[data-s="saving"]::before { background: var(--stamp); }

.savestate[data-s="error"] { color: var(--danger); }
.savestate[data-s="error"]::before { background: var(--danger); }
.savestate[data-s="none"]::before { background: var(--rule-strong); }
.spacer { flex: 1; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: default; background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.icon { padding: 5px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- Pita menu ---------- */
#ribbon { background: var(--surface); border-bottom: 1px solid var(--rule); }
.rtabs { display: flex; gap: 2px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
.rtab { border: 0; background: none; padding: 7px 14px; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.rtab:hover { color: var(--ink); }
.rtab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.rbody { display: flex; align-items: stretch; gap: 0; padding: 6px 10px; overflow-x: auto; min-height: 62px; background: var(--paper); border-top: 1px solid var(--rule); }
.rgroup { display: flex; flex-direction: column; justify-content: space-between; padding: 0 10px; border-right: 1px solid var(--rule); flex: none; }
.rgroup:last-child { border-right: 0; }
.rgroup .rbtns { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; max-width: 560px; }
.rgroup .rname { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 3px; }
.rbtn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid transparent; border-radius: var(--radius); background: none; color: var(--ink); font-size: 13px; white-space: nowrap; }
.rbtn:hover { background: var(--accent-soft); border-color: var(--rule); }
.rbtn:disabled { opacity: .4; cursor: default; background: none; }
.rbtn svg { width: 17px; height: 17px; flex: none; }
.rbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.rbtn.tile { flex-direction: column; gap: 2px; min-width: 62px; padding: 5px 8px; font-size: 12px; }
.rbtn.tile svg { width: 22px; height: 22px; }
.rsel { padding: 4px 6px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--surface); max-width: 190px; }
.colorbtn { position: relative; }
.colorbtn input[type=color] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.colorbtn .swatch { position: absolute; left: 7px; right: 7px; bottom: 2px; height: 3px; border-radius: 2px; background: var(--sw, transparent); }

/* ---------- Bilah rumus ---------- */
#fbar { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
#namebox { width: 88px; text-align: center; border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 4px 6px; background: var(--paper); font-variant-numeric: tabular-nums; }
#fx { color: var(--accent); font-family: var(--font-display); font-style: italic; font-weight: 700; padding: 0 4px; }
#formula { flex: 1; min-width: 0; border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 8px; background: var(--paper); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
#formula:read-only { color: var(--ink-2); }
#formula:not(:read-only) { background: var(--surface); border-color: var(--accent); }
.fnote { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

/* ---------- Area kerja ---------- */
#work { display: flex; flex: 1; min-height: 0; min-width: 0; }
#gridwrap { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
#grid { position: relative; flex: 1; min-height: 0; background: var(--surface); }
#sheettabs { display: flex; align-items: stretch; background: var(--surface-2); border-top: 1px solid var(--rule); min-height: 34px; }
#sheettabs .tabs { display: flex; overflow-x: auto; flex: 1; scrollbar-width: thin; }
.stab { display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 0; border-right: 1px solid var(--rule); background: none; color: var(--ink-2); white-space: nowrap; border-top: 3px solid transparent; }
.stab:hover { background: var(--accent-soft); }
.stab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; border-top-color: var(--tabc, var(--accent)); }
.stab i { width: 9px; height: 9px; border-radius: 50%; background: var(--tabc, transparent); display: inline-block; }
.sbar-info { padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

#panel { width: 400px; max-width: 46vw; border-left: 1px solid var(--rule); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
#panel .phead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
#panel .phead h2 { font-family: var(--font-display); font-size: 17px; margin: 0; flex: 1; font-weight: 600; }
#panel .pbody { flex: 1; overflow-y: auto; padding: 12px 14px 18px; }
#panel .pfoot { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--rule); background: var(--paper); }
#panel .pfoot .btn { flex: 1; }

/* ---------- Formulir ---------- */
.field { margin-bottom: 12px; }
.field > label, .field > .lbl { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=password], select, textarea {
  width: 100%; padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink);
}
textarea { resize: vertical; min-height: 60px; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
.chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.chklist { border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 8px; max-height: 170px; overflow-y: auto; background: var(--paper); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius); overflow: hidden; margin-bottom: 5px; }
.seg button { border: 0; background: var(--surface); padding: 3px 10px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.row2 { display: flex; gap: 6px; align-items: center; }
.row2 > * { min-width: 0; }
.rulerow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 5px; margin-bottom: 5px; }
.rulerow.c3 { grid-template-columns: 1fr 1fr 1fr auto; }
.box { border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px; background: var(--paper); margin-bottom: 12px; }
.box h3 { margin: 0 0 6px; font-size: 13px; }
.note { padding: 8px 10px; border-radius: var(--radius); font-size: 12.5px; margin-bottom: 8px; background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); color: var(--warn-ink); }
.note.err { background: var(--danger-soft); color: var(--danger); }
.preview { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.preview th, .preview td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.preview td.v { font-variant-numeric: tabular-nums; font-weight: 600; }
.preview td.f { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink-3); word-break: break-all; }
.preview .err { color: var(--danger); }

/* ---------- Dialog, menu, toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15, 25, 28, .5); display: grid; place-items: center; z-index: 100; padding: 16px; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 10px; box-shadow: var(--shadow); width: min(480px, 100%); max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--rule); }
.dialog.wide { width: min(860px, 100%); }
.dialog.mid { width: min(640px, 100%); }
.dialog header { padding: 14px 18px 8px; }
.dialog header h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.dialog .dbody { padding: 4px 18px 14px; overflow-y: auto; }
.dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--rule); background: var(--paper); border-radius: 0 0 10px 10px; flex-wrap: wrap; }
.menu { position: fixed; z-index: 200; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 190px; max-height: 70vh; overflow-y: auto; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 4px; color: var(--ink); }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent-soft); }
.menu button:disabled { opacity: .4; cursor: default; }
.menu button svg { width: 16px; height: 16px; }
.menu .kbd { margin-left: auto; color: var(--ink-3); font-size: 11.5px; padding-left: 14px; }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }
.menu .mhead { padding: 4px 10px; font-size: 11.5px; color: var(--ink-3); }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(560px, 94vw); }
.toast { pointer-events: auto; background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; max-width: 100%; }
.toast.err { background: var(--danger); color: #fff; }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 2px 9px; }
#banner { display: flex; gap: 10px; align-items: center; padding: 7px 14px; background: var(--warn-soft); color: var(--warn-ink); border-bottom: 1px solid var(--rule); font-size: 13px; flex-wrap: wrap; }

/* ---------- Grid ---------- */
.g-scroll { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; }
.g-sizer { position: absolute; left: 0; top: 0; pointer-events: none; visibility: hidden; }
.g-stage { position: sticky; top: 0; left: 0; overflow: hidden; outline: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; font-size: 13px; background: var(--surface); }
.g-stage.touchsel { touch-action: none; }
.g-stage .layer { position: absolute; left: 0; top: 0; }
.gc { position: absolute; overflow: hidden; white-space: nowrap; padding: 0 5px; display: flex; align-items: center; border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); line-height: 1.25; font-variant-numeric: tabular-nums; background: var(--surface); }
.gc.sp { overflow: visible; background: transparent; border-right-color: transparent; z-index: 1; }
.gc.wrap { white-space: normal; word-break: break-word; overflow: hidden; }
.gc.err { color: var(--danger); }
.gc.bd { box-shadow: inset 0 0 0 1px var(--ink-2); }
.gc .cap { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 3px; font-size: 9px; display: grid; place-items: center; color: var(--ink-2); z-index: 3; }
.gh { position: absolute; display: flex; align-items: center; justify-content: center; background: var(--grid-head); color: var(--ink-2); font-size: 12px; border-right: 1px solid var(--rule-strong); border-bottom: 3px double var(--rule-strong); overflow: hidden; }
.gh.row { border-bottom: 1px solid var(--rule-strong); border-right: 3px double var(--rule-strong); }
.gh.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.gh .fl { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; color: var(--ink-2); font-size: 9px; background: var(--surface); border: 1px solid var(--rule-strong); }
.gh .fl.act { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gcorner { position: absolute; left: 0; top: 0; background: var(--grid-head); border-right: 3px double var(--rule-strong); border-bottom: 3px double var(--rule-strong); }
.gfrozen-line { position: absolute; left: 0; height: 2px; background: var(--rule-strong); }
.gsel { position: absolute; border: 2px solid var(--accent); background: var(--sel-fill); pointer-events: none; z-index: 5; }
.gact { position: absolute; border: 2px solid var(--accent); box-shadow: inset 0 0 0 1px var(--surface); pointer-events: none; z-index: 6; }
.gfill { position: absolute; width: 8px; height: 8px; background: var(--accent); border: 1px solid var(--surface); cursor: crosshair; z-index: 7; }
.gcopy { position: absolute; border: 2px dashed var(--stamp); pointer-events: none; z-index: 5; }
@media (prefers-reduced-motion: no-preference) { .gcopy { animation: ants .8s linear infinite; } @keyframes ants { to { border-color: var(--accent); } } }
.geditor { position: absolute; z-index: 20; border: 2px solid var(--accent); background: var(--surface); padding: 0 4px; margin: 0; resize: none; outline: none; font-size: 13px; line-height: 1.25; overflow: hidden; border-radius: 0; min-height: 0; white-space: pre; box-shadow: var(--shadow); }
.geditor.bad { border-color: var(--danger); }
.gghost { position: absolute; border: 2px dashed var(--ink-2); pointer-events: none; z-index: 6; }

/* ---------- Beranda ---------- */
.page { flex: 1; overflow-y: auto; padding: 22px clamp(14px, 4vw, 40px) 60px; }
.page .inner { max-width: 1120px; margin: 0 auto; }
.hero { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
.hero h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 38px); margin: 0; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.hero p { margin: 6px 0 0; color: var(--ink-2); max-width: 56ch; }
.sect { margin: 26px 0 10px; display: flex; align-items: baseline; gap: 12px; }
.sect h2 { font-family: var(--font-display); font-size: 21px; margin: 0; font-weight: 600; }
.sect .sub { color: var(--ink-3); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.wcard, .tcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.tcard { cursor: pointer; border-left: 4px solid var(--accent); }
.tcard:hover, .wcard:hover { border-color: var(--accent); background: var(--accent-soft); }
.tcard .ti { font-size: 22px; line-height: 1; }
.tcard h3, .wcard h3 { margin: 4px 0 0; font-size: 15px; font-weight: 600; }
.tcard p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
.wcard .meta { color: var(--ink-3); font-size: 12px; }
.wcard .acts { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.empty { border: 2px dashed var(--rule-strong); border-radius: 10px; padding: 26px; text-align: center; color: var(--ink-2); background: var(--surface); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; counter-reset: s; }
.steps li { list-style: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; counter-increment: s; }
.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; margin-bottom: 4px; }
.steps { padding: 0; margin: 0; }
.search { position: relative; max-width: 360px; flex: 1; }

/* ---------- Dashboard ---------- */
.dgrid { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
.dcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; position: relative; min-width: 0; }
.dcard.kpi { grid-column: span 1; }
.dcard.ch { grid-column: span 2; min-height: 300px; }
.dcard.ch.full { grid-column: span 4; }
.dcard .dt { font-size: 13px; color: var(--ink-2); margin: 0 0 4px; padding-right: 60px; }
.dcard .big { font-family: var(--font-display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.dcard .subt { font-size: 12px; color: var(--ink-3); }
.dcard .wtools { position: absolute; right: 6px; top: 6px; display: flex; gap: 2px; opacity: 0; }
.dcard:hover .wtools, .dcard:focus-within .wtools { opacity: 1; }
.dcard svg.chart { width: 100%; height: auto; display: block; }
.dfilters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding: 10px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 12px; }
.dfilters .field { margin: 0; min-width: 140px; }
@media (max-width: 900px) { .dgrid { grid-template-columns: repeat(2, 1fr); } .dcard.ch, .dcard.ch.full { grid-column: span 2; } }
@media (max-width: 520px) { .dgrid { grid-template-columns: 1fr; } .dcard.ch, .dcard.ch.full, .dcard.kpi { grid-column: span 1; } }

/* ---------- Dokumen / asisten ---------- */
.split { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 16px; align-items: start; }
.docframe { width: 100%; height: 72vh; border: 1px solid var(--rule); border-radius: 8px; background: #fff; }
.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 12px 14px; margin-bottom: 10px; }
.step h3 { margin: 0 0 2px; font-size: 15px; }
.step .why { color: var(--ink-2); font-size: 13px; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { border: 1px solid var(--rule-strong); border-radius: 99px; padding: 3px 10px; background: var(--surface); font-size: 12.5px; }
.chip:hover { background: var(--accent-soft); }
table.kv { border-collapse: collapse; width: 100%; }
table.kv td, table.kv th { border-bottom: 1px solid var(--rule); padding: 5px 8px; text-align: left; font-size: 13px; }
.imp-preview { overflow: auto; max-height: 230px; border: 1px solid var(--rule); border-radius: 6px; }
.imp-preview table { border-collapse: collapse; font-size: 12px; }
.imp-preview td, .imp-preview th { border: 1px solid var(--grid-line); padding: 2px 6px; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.imp-preview th { background: var(--grid-head); font-weight: 600; }
.dropzone { border: 2px dashed var(--rule-strong); border-radius: 10px; padding: 28px; text-align: center; background: var(--paper); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.kbdk { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }

/* ---------- Responsif ---------- */
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #nav { order: 2; flex-direction: row; border-right: 0; border-top: 1px solid var(--rule); padding: 0; justify-content: space-around; overflow-x: auto; }
  #nav .brand, .nav-spacer { display: none; }
  .nav-btn { flex: 1; border-left: 0; border-top: 3px solid transparent; padding: 6px 2px; min-width: 56px; }
  .nav-btn[aria-current="page"] { border-left-color: transparent; border-top-color: var(--accent); }
  #panel { position: fixed; inset: 0; width: 100%; max-width: none; z-index: 60; }
  .split { grid-template-columns: 1fr; }
  #topbar .wbname { width: 14ch; min-width: 80px; }
  .hide-sm { display: none !important; }
  #namebox { width: 64px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print { #nav, #topbar, #ribbon, #fbar, #sheettabs, #panel { display: none !important; } }
